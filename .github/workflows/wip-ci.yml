name: wip-ci

on:
  push:
    branches: [jackdanger/wip]

env:
  # Upstream unit tests asserting behaviors the fork deliberately changed
  # (import move/copy semantics, tracked-download source-title matching,
  # delete-once bookkeeping). Baseline debt tracked in docs/FORK.md — shrink
  # this list by updating each test to the fork's invariant, never by adding
  # to it without a FORK.md entry.
  FORK_DRIFT_FILTER: >-
    Name!=config_properties_should_write_and_read_using_same_key&
    Name!=should_copy_when_cannot_move_files_downloads&
    Name!=should_delete_single_track_file_once&
    Name!=should_delete_the_same_track_file_only_once&
    Name!=should_delete_track_file_from_database&
    Name!=should_include_scene_name_with_new_downloads&
    Name!=should_log_error_and_delete_if_musicbrainz_id_not_found_and_author_has_no_files&
    Name!=should_log_error_but_not_delete_if_musicbrainz_id_not_found_and_artist_has_files&
    Name!=should_log_error_if_musicbrainz_id_not_found&
    Name!=should_move_new_downloads&
    Name!=should_not_return_disk_access_command_if_another_running&
    Name!=should_publish_TrackImportedEvent_for_new_downloads&
    Name!=should_return_old_track_file_in_oldFiles&
    Name!=should_track_downloads_using_the_source_title_if_it_cannot_be_found_using_the_download_title&
    Name!=should_use_override_importmode&
    Name!=should_use_parsed_artist_title

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build backend
        run: dotnet build src/Lidarr.sln -c Release
      - name: Core unit tests
        run: >
          FILTER=$(echo "${FORK_DRIFT_FILTER}" | tr -d ' \n');
          dotnet test src/NzbDrone.Core.Test/Lidarr.Core.Test.csproj
          -c Release --no-build
          --filter "TestCategory!=IntegrationTest&TestCategory!=AutomationTest&TestCategory!=DiskAccessTest&${FILTER}"
          --logger "console;verbosity=minimal"
